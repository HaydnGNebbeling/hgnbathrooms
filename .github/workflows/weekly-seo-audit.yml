name: Weekly SEO Audit

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 8am UTC
  workflow_dispatch:       # Allow manual trigger

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SEO Audit
        id: audit
        run: |
          SITEMAP_URLS=$(grep '<loc>' sitemap.xml | sed 's/.*<loc>//;s/<\/loc>//')
          TOTAL=0
          ERRORS=0
          REPORT=""
          ISSUE_BODY=""

          while IFS= read -r url; do
            TOTAL=$((TOTAL + 1))
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 15 "$url")

            if [ "$STATUS" != "200" ]; then
              ERRORS=$((ERRORS + 1))
              REPORT="$REPORT\n❌ $STATUS — $url"
            fi
          done <<< "$SITEMAP_URLS"

          # Check meta tags on key pages
          META_ISSUES=""
          KEY_PAGES=(
            "https://hgnbathrooms.co.uk/"
            "https://hgnbathrooms.co.uk/bathroom-renovations.html"
            "https://hgnbathrooms.co.uk/wet-room-installation.html"
          )

          for page in "${KEY_PAGES[@]}"; do
            HTML=$(curl -s -L --max-time 15 "$page")
            TITLE=$(echo "$HTML" | grep -o '<title>[^<]*</title>' | sed 's/<[^>]*>//g')
            TITLE_LEN=${#TITLE}
            if [ "$TITLE_LEN" -lt 30 ] || [ "$TITLE_LEN" -gt 65 ]; then
              META_ISSUES="$META_ISSUES\n⚠️ Title length $TITLE_LEN chars on: $page"
            fi
            if ! echo "$HTML" | grep -q 'G-BWXRPFK6GN'; then
              META_ISSUES="$META_ISSUES\n⚠️ GA4 tag missing on: $page"
            fi
            if ! echo "$HTML" | grep -q 'application/ld+json'; then
              META_ISSUES="$META_ISSUES\n⚠️ No structured data on: $page"
            fi
          done

          # Build report
          DATE=$(date '+%Y-%m-%d')
          SITEMAP_COUNT=$(echo "$SITEMAP_URLS" | wc -l | tr -d ' ')

          ISSUE_BODY="## HGN Bathrooms — Weekly SEO Audit ($DATE)

          ### Page Status
          - **Total pages in sitemap:** $SITEMAP_COUNT
          - **Pages returning 200 OK:** $((TOTAL - ERRORS))
          - **Errors:** $ERRORS

          $(if [ -n "$REPORT" ]; then echo "### ❌ Page Errors"; echo -e "$REPORT"; fi)

          ### Meta Tag Checks
          $(if [ -z "$META_ISSUES" ]; then echo "✅ All key pages pass meta tag checks"; else echo -e "$META_ISSUES"; fi)

          ### Next Actions
          - [ ] Check [Google Search Console](https://search.google.com/search-console) for new coverage issues
          - [ ] Check [GA4 Realtime](https://analytics.google.com) for traffic anomalies
          - [ ] Review any errors above and fix in codebase

          ---
          *Auto-generated by GitHub Actions. [View workflow](https://github.com/${{ github.repository }}/actions)*"

          # Save for next step
          echo "errors=$ERRORS" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          {
            echo 'body<<EOF'
            echo "$ISSUE_BODY"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const errors = '${{ steps.audit.outputs.errors }}';
            const total = '${{ steps.audit.outputs.total }}';
            const body = `${{ steps.audit.outputs.body }}`;
            const date = new Date().toISOString().split('T')[0];
            const status = errors === '0' ? '✅' : '❌';

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `${status} Weekly SEO Audit — ${date} (${total} pages, ${errors} errors)`,
              body: body,
              labels: ['seo-audit']
            });
