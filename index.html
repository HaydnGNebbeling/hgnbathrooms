  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, rgba(26,58,92,0.06) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(91,155,213,0.06) 0%, transparent 60%);
      pointer-events: none;
    }

    body::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #1a3a5c, #5b9bd5, #1a3a5c);
    }

    .splash {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 40px 24px;
      animation: fadeIn 1s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .logo-wrap {
      margin-bottom: 36px;
      animation: fadeIn 1s ease 0.2s both;
    }

    .logo-wrap img {
      width: clamp(260px, 40vw, 420px);
      height: auto;
      display: block;
    }

    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, #1a3a5c, #5b9bd5);
      margin: 0 auto 28px;
      border-radius: 2px;
      animation: fadeIn 1s ease 0.4s both;
    }

    .tagline {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(1rem, 2.5vw, 1.3rem);
      font-weight: 500;
      color: #1a3a5c;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      animation: fadeIn 1s ease 0.5s both;
    }

    .location {
      font-size: 0.82rem;
      color: #6b7a90;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 48px;
      animation: fadeIn 1s ease 0.6s both;
    }

    .enter-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #1a3a5c;
      color: #ffffff;
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 16px 48px;
      border-radius: 50px;
      text-decoration: none;
      transition: all 0.3s ease;
      animation: fadeIn 1s ease 0.8s both;
      box-shadow: 0 8px 30px rgba(26, 58, 92, 0.2);
    }

    .enter-btn:hover {
      background: #2c5aa0;
      transform: translateY(-3px);
      box-shadow: 0 14px 40px rgba(26, 58, 92, 0.28);
    }

    .enter-btn svg {
      width: 16px; height: 16px;
      transition: transform 0.3s;
    }

    .enter-btn:hover svg { transform: translateX(4px); }

    .footer-note {
      position: absolute;
      bottom: 28px;
      left: 0; right: 0;
      text-align: center;
      font-size: 0.78rem;
      color: #9aa4b2;
      letter-spacing: 0.5px;
    }

    .footer-note a {
      color: #5b9bd5;
      text-decoration: none;
    }
  </style>

  <div class="splash">

    <p class="location">Lingfield, Surrey &nbsp;·&nbsp; Surrey, Kent &amp; Sussex</p>
    <a href="home.html" class="enter-btn">

        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </a>
  </div>

  <p class="footer-note">
    <a href="tel:01293804790">01293 804 790</a> &nbsp;·&nbsp; hgnbathrooms.co.uk
  </p>

</body>
